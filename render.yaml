# Blueprint Render : https://render.com/docs/blueprint-spec
# Seul MONGODB_URI est obligatoire au premier déploiement.
# ADMIN_EMAIL + ADMIN_PASSWORD : créent / mettent à jour le compte admin au démarrage.
# Google / Stripe : à remplir plus tard dans le dashboard Render.

services:
  - type: web
    name: auto-documents-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Domaine public (CORS + redirections OAuth). L’URL .onrender.com reste aussi autorisée dans le code.
      - key: FRONTEND_URL
        value: https://www.actedevente.fr
      - key: FRONTEND_PRIMARY_URL
        value: https://www.actedevente.fr
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: auto-documents-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: auto-documents-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
    # Les pages publiques sont pré-rendues (dist/<page>/index.html) et servies
    # telles quelles. Seules les routes de l'application connectée sont
    # réécrites vers une coquille vide (noindex). Toute autre URL inconnue
    # reçoit dist/404.html avec un vrai statut 404.
    routes:
      - type: rewrite
        source: /login
        destination: /app.html
      - type: rewrite
        source: /register
        destination: /app.html
      - type: rewrite
        source: /dashboard
        destination: /app.html
      - type: rewrite
        source: /generate
        destination: /app.html
      - type: rewrite
        source: /admin
        destination: /app.html
      - type: rewrite
        source: /auth/*
        destination: /app.html
