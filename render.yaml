# Blueprint Render : https://render.com/docs/blueprint-spec
# Seul MONGODB_URI est obligatoire au premier déploiement.
# ADMIN_EMAIL + ADMIN_PASSWORD : créent / mettent à jour le compte admin au démarrage.
# Google / Stripe : à remplir plus tard dans le dashboard Render.

services:
  - type: web
    name: auto-documents-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Domaine public (CORS + redirections OAuth). L’URL .onrender.com reste aussi autorisée dans le code.
      - key: FRONTEND_URL
        value: https://www.actedevente.fr
      - key: FRONTEND_PRIMARY_URL
        value: https://www.actedevente.fr
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: auto-documents-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: auto-documents-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
    # Pages publiques pré-rendues (dist/<page>/index.html). Render ne sert le
    # index.html d'un dossier que si l'URL finit par « / » : chaque page a donc
    # sa propre réécriture. ⚠️ Nouvelle page ou nouvel article de blog = ajouter
    # une règle ici ET dans le tableau de bord Render (Redirects/Rewrites) ;
    # le build affiche un avertissement si une page n'a pas de règle.
    # Pas de règle « /* » : toute autre URL reçoit dist/404.html (vrai 404).
    routes:
      - type: rewrite
        source: /login
        destination: /app.html
      - type: rewrite
        source: /register
        destination: /app.html
      - type: rewrite
        source: /dashboard
        destination: /app.html
      - type: rewrite
        source: /generate
        destination: /app.html
      - type: rewrite
        source: /admin
        destination: /app.html
      - type: rewrite
        source: /auth/*
        destination: /app.html
      - type: rewrite
        source: /cerfa-15776
        destination: /cerfa-15776/index.html
      - type: rewrite
        source: /documents-vente-vehicule
        destination: /documents-vente-vehicule/index.html
      - type: rewrite
        source: /facture-vente-vehicule-occasion
        destination: /facture-vente-vehicule-occasion/index.html
      - type: rewrite
        source: /contrat-vente-vehicule-occasion
        destination: /contrat-vente-vehicule-occasion/index.html
      - type: rewrite
        source: /mandat-immatriculation-cerfa-13757
        destination: /mandat-immatriculation-cerfa-13757/index.html
      - type: rewrite
        source: /blog
        destination: /blog/index.html
      - type: rewrite
        source: /blog/comment-remplir-cerfa-15776
        destination: /blog/comment-remplir-cerfa-15776/index.html
      - type: rewrite
        source: /blog/documents-vente-pro-particulier
        destination: /blog/documents-vente-pro-particulier/index.html
      - type: rewrite
        source: /blog/quitus-fiscal-vehicule-quand
        destination: /blog/quitus-fiscal-vehicule-quand/index.html
      - type: rewrite
        source: /blog/importer-voiture-ue-papiers-necessaires
        destination: /blog/importer-voiture-ue-papiers-necessaires/index.html
      - type: rewrite
        source: /blog/checklist-import-vehicule-occasion-etranger
        destination: /blog/checklist-import-vehicule-occasion-etranger/index.html
      - type: rewrite
        source: /blog/demande-quitus-fiscal-ants-grand-est-sie
        destination: /blog/demande-quitus-fiscal-ants-grand-est-sie/index.html
      - type: rewrite
        source: /mentions-legales
        destination: /mentions-legales/index.html
      - type: rewrite
        source: /confidentialite
        destination: /confidentialite/index.html
